[plugin]

name="GrassKit"
description="Grass for 3D worlds, drawn on the GPU around the camera: blades in cells that move with it, tiers that thin with distance without popping, a ground read from the colliders, clearings, trampling and a look that changes in play. No network, no game rules, no autoload."
author="godot-studio"
version="0.2.0"
script="plugin.gd"
