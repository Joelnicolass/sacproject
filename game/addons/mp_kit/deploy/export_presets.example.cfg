; Two presets to merge into your project's export_presets.cfg (Project > Export also creates them).
; "Linux Server": the binary the VPS runs (room server, dedicated and every match). A normal Linux export, not the
; "Dedicated Server" mode: the match needs the whole world (collisions, navigation). Needs the Linux export templates.
; "Web": the browser client (WebSocket only). No threads, so any static host works without special headers.

[preset.0]

name="Linux Server"
platform="Linux"
runnable=false
dedicated_server=false
export_filter="all_resources"
exclude_filter=""
export_path="build/server/game.x86_64"

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
export_filter="all_resources"
exclude_filter=""
export_path="build/web/index.html"

[preset.1.options]

variant/thread_support=false
html/canvas_resize_policy=2
progressive_web_app/enabled=false
