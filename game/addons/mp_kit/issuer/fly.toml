# MpKit issuer on Fly.io. Copy this folder (or deploy it from here): set `app`, the region and the [env] values, put
# the private key in a Fly secret (README "Put it on Fly"), then `fly deploy --ha=false`.
app = "my-game-issuer"
primary_region = "gru"

[build]

[env]
  PORT = "8090"
  # Fly's proxy sets Fly-Client-IP: the limits count the player's real IP.
  ISSUER_TRUST_PROXY = "fly"
  # The relay the rooms use (its RELAY_TOKEN_KEYS holds this issuer's public key).
  ISSUER_RELAY_URL = "wss://my-relay.fly.dev"
  # Your games: their id (MpNetConfig.game_id), the oldest version allowed, the most players and rooms.
  ISSUER_GAMES = '{"my-game": {"min_version": "1.0.0", "max_players": 8, "max_rooms": 500}}'
  # Where the web build is served from (CORS); empty = desktop builds only.
  ISSUER_ORIGINS = "https://my-game.example.com"

[http_service]
  internal_port = 8090
  force_https = true
  # Rooms live in this process's memory: one machine, always on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
