[plugin]

name="PropKit"
description="Props for 2D and 3D worlds: scatter them over any ground (clusters, keep-outs, masks, variants), draw thousands in a few batches, and bake the navmesh in zones with the props as cheap obstructions, re-baking only what changed on worker threads. No network, no game rules, no autoload."
author="godot-studio"
version="0.2.2"
script="plugin.gd"
