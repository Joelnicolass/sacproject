# Config of the determinism bench of Sacrifice (sourced by the kit's det_run.sh). Paths are relative to the project.
DET_SCENE=res://debug/ai/ai_match.tscn
DET_OUT=agent/out/det
DET_BASELINE=agent/det_baseline.txt
# Same machine-wide queue as agent/harness/godot_run.sh (locks in /tmp/sacproject_godot.*).
export GODOT_RUN_NS=sacproject
export GODOT_BIN="${GODOT_BIN:-/Applications/Godot.app/Contents/MacOS/Godot}"
