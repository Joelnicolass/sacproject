; Settings the game ships with, read by scenes/core/game_settings.gd (GameSettings).
; Not a resource: every export preset needs `config.cfg` in its include filter (Resources tab).

[game]

; The game's version. At startup it becomes Project Settings > Application > Config > Version,
; which the issuer compares: joining a room needs the host's version.
version="0.1.0"

[online]

; The issuer of the online rooms (production), base64url without padding (RFC 4648 §5).
; It is not a secret: the issuer validates every request. Encode a new one with
;   printf '%s' 'https://host' | base64 | tr '+/' '-_' | tr -d '='
; The --issuer-url= flag overrides it (a test against a local issuer).
issuer_url_b64="aHR0cHM6Ly9pc3N1ZXItZ29kb3QuZmx5LmRldg"
; This game's id on the issuer (one of its ISSUER_GAMES). --issuer-game= overrides it.
game_id="sacrifice"
